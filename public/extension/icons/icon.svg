<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" />
  
  <!-- Bridge Arcs (Context Connection) -->
  <path d="M 28 88 C 28 54, 54 28, 88 28" fill="none" stroke="url(#bridgeGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 44 88 C 44 64, 64 44, 88 44" fill="none" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 8" />
  
  <!-- Context Nodes -->
  <circle cx="28" cy="88" r="10" fill="#38bdf8" />
  <circle cx="88" cy="28" r="10" fill="#38bdf8" />
  <circle cx="88" cy="88" r="8" fill="#94a3b8" />

  <!-- Horizontal Pier Deck -->
  <line x1="24" y1="88" x2="104" y2="88" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  
  <!-- Center Glow Indicator -->
  <circle cx="58" cy="58" r="5" fill="#38bdf8" />
</svg>
